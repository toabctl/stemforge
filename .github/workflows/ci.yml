name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tox and plugins
        run: pip install tox tox-uv

      - name: Run tox
        run: tox
